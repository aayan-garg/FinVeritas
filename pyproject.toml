[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finveritas"
version = "0.1.0"
description = "FinVeritas: Earnings-Call Question-Evasion Detection and Financial Claim Verification against SEC Filings"
readme = "README.md"
authors = [{ name = "FinVeritas Engineering Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "experiments/legacy",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
