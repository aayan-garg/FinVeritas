# FinVeritas Checkpoint 07: Advanced Hybrid Financial Evidence Retrieval Configuration
# Reproducible evaluation across 5 configurations on FinanceBench (150 questions, 12,013 PDF pages)

benchmark:
  name: "FinanceBench"
  version: "1.0.0"
  total_questions: 150
  unique_source_documents: 84
  total_corpus_pages: 12013
  evaluation_cutoffs: [1, 3, 5, 10]
  bootstrap_iterations: 1000
  bootstrap_seed: 42

paths:
  data_dir: "data/raw/financebench"
  metadata_open_source: "data/raw/financebench/financebench_open_source.jsonl"
  metadata_doc_info: "data/raw/financebench/financebench_document_information.jsonl"
  pdf_dir: "data/raw/financebench/pdfs"
  page_corpus_cache: "data/interim/financebench/page_corpus.jsonl"
  artifacts_dir: "artifacts/advanced_retrieval"
  cache_dir: "artifacts/advanced_retrieval/cache"

configurations:
  # Configuration A: Reference Page-Level BM25 Baseline
  config_a_page_bm25:
    type: "page_bm25"
    description: "Okapi BM25 on full 0-indexed extracted PDF pages (exact reproduction baseline)"
    k1: 1.5
    b: 0.75
    epsilon: 0.25

  # Configuration B: Chunk-Level BM25
  config_b_chunk_bm25:
    type: "chunk_bm25"
    description: "Okapi BM25 on overlapping text passage chunks mapped back to source pages"
    chunk_size: 256
    chunk_overlap: 64
    k1: 1.5
    b: 0.75
    candidate_k: 100

  # Configuration C: Dense Vector Retrieval (BGE-Small)
  config_c_dense:
    type: "dense_bge"
    description: "Dense semantic retrieval with BAAI/bge-small-en-v1.5 and cosine similarity"
    model_name: "BAAI/bge-small-en-v1.5"
    model_revision: "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
    dimension: 384
    batch_size: 32
    query_prefix: "Represent this sentence for searching relevant passages: "
    candidate_k: 100

  # Configuration D: Hybrid Retrieval with Reciprocal Rank Fusion
  config_d_hybrid_rrf:
    type: "hybrid_rrf"
    description: "Reciprocal Rank Fusion (k=60) combining BM25 and BGE dense chunk rankings"
    rrf_k: 60
    candidate_k: 100

  # Configuration E: Hybrid Retrieval + Neural Reranker (BGE-Reranker-Base)
  config_e_neural_rerank:
    type: "hybrid_neural_rerank"
    description: "Two-stage retrieval: Hybrid RRF (top 30 candidate chunks) + BGE Cross-Encoder reranker"
    model_name: "BAAI/bge-reranker-base"
    model_revision: "2cfc18c9415c912f9d8155881c133215df768a70"
    candidate_chunks_k: 30
    batch_size: 16
    max_length: 512

ablations:
  chunk_sizes:
    - { chunk_size: 256, chunk_overlap: 64 }
    - { chunk_size: 384, chunk_overlap: 64 }
